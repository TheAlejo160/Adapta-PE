            <div data-hf-id="hf-43qv" class="cap00-edicion" id="cap00-lite"><img data-hf-id="hf-1njo" src="../assets/marca/adapta-lite.webp" alt="" /><span data-hf-id="hf-tsm5">Lite</span></div>

      <script>
        (function () {
          const ID = "cap00";
          const cap = AP.capitulo(ID);
          const raiz = document.getElementById(ID + "-raiz");
          const D = cap.duracion;
          // Tiempos de las frases (con respaldo proporcional si cambia el guion).
          const f1 = AP.t(ID, "f1", 0.6);
          const f2 = AP.t(ID, "f2", D * 0.2);
          const f3 = AP.t(ID, "f3", D * 0.46);
          const f4 = AP.t(ID, "f4", D * 0.66);
          // Hitos de partículas que lee el módulo three.js (s relativos a la escena).
          window.__cap00Hitos = { f1, f2, f3, f4, D };

          const tl = gsap.timeline({ paused: true });

          // ── Reloj que dibuja three.js en cada seek ──
          const reloj = { t: 0 };
          tl.fromTo(
            reloj,
            { t: 0 },
            {
              t: D + 1,
              duration: D + 1,
              ease: "none",
              onUpdate: () => window.__cap00Dibujar && window.__cap00Dibujar(reloj.t),
            },
            0
          );
          window.__cap00Reloj = reloj;
          // El runtime espera a que la escena 3D esté lista antes de capturar.
          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady["cap00-three"] = new Promise((ok) => (window.__cap00Listo = ok));

          // ── f1: «¡Hola!» — logo sobre la onda ──
          tl.fromTo("#cap00-logo", { opacity: 0, scale: 0.5, rotation: -8 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.6)" }, f1 + 1.0);
          tl.to("#cap00-logo", { scale: 1.04, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, f1 + 1.8);
          tl.to("#cap00-logo", { opacity: 0, scale: 0.7, y: -40, duration: 0.5, ease: "power2.in" }, f2);

          // ── f2: sin ratón ni teclado; la cabeza guía el cursor ──
          const per = "#cap00-perifericos";
          tl.fromTo(per, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, f2 + 0.3);
          tl.fromTo("#cap00-tachado-linea", { attr: { "stroke-dashoffset": 660 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, f2 + 1.3);
          tl.to(per, { opacity: 0, scale: 0.9, duration: 0.4, ease: "power2.in" }, f2 + 1.95);

          const tCab = f2 + 2.1;
          tl.fromTo("#cap00-cabeza", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, tCab);
          tl.fromTo("#cap00-guia", { opacity: 0 }, { opacity: 1, duration: 0.4 }, tCab + 0.2);
          const cur = AP.cursor(tl, raiz, { id: ID + "-cursor", x: 1180, y: 430, tipo: "flecha", entrada: tCab + 0.25 });
          // Cada giro de la cabeza mueve el cursor en la misma dirección.
          const giros = [
            { rot: 14, x: 1520, y: 400 },
            { rot: -10, x: 1040, y: 560 },
            { rot: 6, x: 1380, y: 660 },
          ];
          const tramo = Math.max(0.5, (f3 - 0.3 - (tCab + 0.6)) / giros.length);
          giros.forEach((g, i) => {
            const tt = tCab + 0.6 + i * tramo;
            tl.to("#cap00-cabeza", { rotation: g.rot, duration: tramo * 0.8, ease: "sine.inOut" }, tt);
            cur.mover(tt, g.x, g.y, tramo * 0.85, "sine.inOut");
          });
          tl.to(["#cap00-cabeza", "#cap00-guia"], { opacity: 0, duration: 0.35, ease: "power1.in" }, f3 - 0.1);
          cur.ocultar(f3 - 0.1);

          // ── f3: voz, cabeza o manos (una tarjeta por palabra) ──
          const durF3 = AP.tFin(ID, "f3", f3 + 2.9) - f3;
          ["#cap00-modo-voz", "#cap00-modo-cabeza", "#cap00-modo-manos"].forEach((sel, i) => {
            const tt = f3 + 0.35 + i * (durF3 * 0.3);
            tl.fromTo(sel, { opacity: 0, y: 60, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, tt);
            tl.fromTo(sel + " .cap00-modo-icono", { scale: 0.6 }, { scale: 1, duration: 0.6, ease: "elastic.out(1, 0.5)" }, tt + 0.1);
          });
          tl.to("#cap00-modos", { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, f4 - 0.15);

          // ── f4: título ──
          tl.fromTo("#cap00-titulo", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, f4 + 0.2);
          tl.fromTo("#cap00-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, f4 + 0.8);
          tl.fromTo("#cap00-base", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, f4 + 1.5);
          tl.fromTo("#cap00-lite", { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, f4 + 1.7);
          tl.fromTo(["#cap00-base img", "#cap00-lite img"], { rotation: -6 }, { rotation: 6, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, f4 + 2.3);

          window.__timelines[ID] = tl;
        })();
      </script>

      <script type="module">
        import * as THREE from "three";

        const H = window.__cap00Hitos;
        const lienzo = document.getElementById("cap00-lienzo");
        const render = new THREE.WebGLRenderer({ canvas: lienzo, alpha: true, antialias: true, preserveDrawingBuffer: true });
        render.setPixelRatio(1);
        render.setSize(1920, 1080, false);
        const escena = new THREE.Scene();
        const camara = new THREE.PerspectiveCamera(35, 1920 / 1080, 0.1, 100);
        camara.position.set(0, 0, 10);

        // PRNG determinista (mismo que AP.azar).
        const azar = window.AP.azar(2026);
        const N = 2600;
        const COL = 104; // columnas de la onda
        const FIL = Math.ceil(N / COL);
        const estrellas = new Float32Array(N * 3);
        const anillo = new Float32Array(N * 3);
        const retraso = new Float32Array(N);
        const colores = new Float32Array(N * 3);
        const verde = new THREE.Color("#86efac");
        const blanco = new THREE.Color("#f1f5f9");
        const amarillo = new THREE.Color("#fcd34d");
        for (let i = 0; i < N; i++) {
          estrellas[i * 3] = (azar() * 2 - 1) * 7.5;
          estrellas[i * 3 + 1] = (azar() * 2 - 1) * 4.2;
          estrellas[i * 3 + 2] = -6 + azar() * 8;
          const a = azar() * Math.PI * 2;
          const r = 3.1 + (azar() - 0.5) * 0.9;
          anillo[i * 3] = Math.cos(a) * r * 1.35;
          anillo[i * 3 + 1] = Math.sin(a) * r * 0.82;
          anillo[i * 3 + 2] = (azar() - 0.5) * 2.4;
          retraso[i] = azar();
          const c = azar();
          const col = c < 0.07 ? amarillo : c < 0.24 ? blanco : verde;
          colores.set([col.r, col.g, col.b], i * 3);
        }
        const pos = new Float32Array(N * 3);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        geo.setAttribute("color", new THREE.BufferAttribute(colores, 3));

        // Punto suave generado en un canvas (sin archivos externos).
        const cv = document.createElement("canvas");
        cv.width = cv.height = 64;
        const cx = cv.getContext("2d");
        const g = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
        g.addColorStop(0, "rgba(255,255,255,1)");
        g.addColorStop(0.45, "rgba(255,255,255,0.85)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        cx.fillStyle = g;
        cx.fillRect(0, 0, 64, 64);
        const textura = new THREE.CanvasTexture(cv);

        const mat = new THREE.PointsMaterial({
          size: 0.11,
          map: textura,
          vertexColors: true,
          transparent: true,
          depthWrite: false,
          opacity: 0.95,
          blending: THREE.AdditiveBlending,
        });
        const puntos = new THREE.Points(geo, mat);
        escena.add(puntos);

        const suave = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
        const tramo = (t, a, b) => suave((t - a) / (b - a));

        // Onda de voz: barras simétricas cuya altura late con el tiempo.
        function onda(i, t, yBase, amp, ancho) {
          const col = i % COL;
          const fila = Math.floor(i / COL);
          const u = col / (COL - 1);
          const x = (u * 2 - 1) * ancho;
          const env = Math.exp(-Math.pow(x / (ancho * 0.55), 2));
          const late = 0.35 + 0.65 * Math.abs(Math.sin(t * 2.6 + col * 0.41) * Math.cos(t * 1.3 - col * 0.17));
          const h = (0.08 + amp * env * late) * ((fila / (FIL - 1)) * 2 - 1);
          return [x, yBase + h, (retraso[i] - 0.5) * 0.3];
        }

        function dibujar(t) {
          // Mezclas por fase (ver comentario de la escena).
          const aOnda = tramo(t, H.f1, H.f1 + 1.4); // estrellas → onda
          const aAnillo = tramo(t, H.f2, H.f2 + 1.2); // onda → anillo
          const aFinal = tramo(t, H.f4, H.f4 + 1.4); // anillo → onda final
          for (let i = 0; i < N; i++) {
            const d = retraso[i] * 0.35;
            const k1 = suave((aOnda - d) / 0.65);
            const k2 = suave((aAnillo - d) / 0.65);
            const k3 = suave((aFinal - d) / 0.65);
            // Estrellas a la deriva.
            let x = estrellas[i * 3] + Math.sin(t * 0.25 + i) * 0.15;
            let y = estrellas[i * 3 + 1] + Math.cos(t * 0.2 + i * 0.7) * 0.12;
            let z = estrellas[i * 3 + 2];
            const o1 = onda(i, t, -0.05, 1.25, 5.2);
            x += (o1[0] - x) * k1;
            y += (o1[1] - y) * k1;
            z += (o1[2] - z) * k1;
            // Anillo que gira despacio.
            const ang = t * 0.12;
            const ax = anillo[i * 3] * Math.cos(ang) - anillo[i * 3 + 2] * Math.sin(ang) * 0.3;
            const ay = anillo[i * 3 + 1];
            const az = anillo[i * 3 + 2] * Math.cos(ang) - 1.5;
            x += (ax - x) * k2;
            y += (ay - y) * k2;
            z += (az - z) * k2;
            // Onda final, baja y ancha, bajo el título.
            const o3 = onda(i, t, -1.3, 0.4, 5.4);
            x += (o3[0] - x) * k3;
            y += (o3[1] - y) * k3;
            z += (o3[2] - z) * k3;
            pos[i * 3] = x;
            pos[i * 3 + 1] = y;
            pos[i * 3 + 2] = z;
          }
          geo.attributes.position.needsUpdate = true;
          // Más tenue mientras hay contenido delante (fases B y C).
          mat.opacity = 0.95 - 0.5 * aAnillo + 0.3 * aFinal;
          puntos.rotation.z = Math.sin(t * 0.1) * 0.03;
          render.render(escena, camara);
        }

        window.__cap00Dibujar = dibujar;
        dibujar(window.__cap00Reloj ? window.__cap00Reloj.t : 0);
        window.__cap00Listo && window.__cap00Listo();
      </script>
    </template>
