      <script>
        (function () {
          const ID = "cap13";
          const cap = AP.capitulo(ID);
          const raiz = document.getElementById(ID + "-raiz");
          const D = cap.duracion;
          const f = (n, r) => AP.t(ID, "f" + n, r);
          const fin = (n, r) => AP.tFin(ID, "f" + n, r);
          const t1 = f(1, 0.6), t2 = f(2, 3.7), t3 = f(3, 7.8), t4 = f(4, 12.7), t5 = f(5, 16.8), t6 = f(6, 22.7);

          const tl = gsap.timeline({ paused: true });
          AP.ambiente(tl, raiz, { duracion: D, semilla: 13 });

          // ── f1: título ──
          AP.tituloCapitulo(tl, raiz, { id: ID + "-titulo", etiqueta: "Para terminar", titulo: "Consejos rápidos", entrada: t1, salida: t2 - 0.45 });

          // ── f2: Base y Lite a la vez → voz sólo en una ──
          AP.paso(tl, raiz, { id: ID + "-c1", n: 1, total: 3, etiqueta: "Consejo 1 de 3", texto: "Voz encendida en una sola", x: 96, y: 120, entrada: t2, salida: t3 - 0.4 });
          const pb = AP.popup(tl, raiz, {
            id: ID + "-popup-base",
            edicion: "base",
            x: 340,
            y: 400,
            interruptores: [{ texto: "Voz", activo: false, cambiaEn: t2 + 1.4 }],
            entrada: t2 + 0.4,
          });
          const pl = AP.popup(tl, raiz, {
            id: ID + "-popup-lite",
            edicion: "lite",
            x: 1020,
            y: 400,
            interruptores: [{ texto: "Voz", activo: false }],
            entrada: t2 + 0.6,
          });
          AP.salir(tl, pb.el, t3 - 0.4);
          AP.salir(tl, pl.el, t3 - 0.4);

          // ── f3: permiso del micrófono + Google Chrome ──
          AP.paso(tl, raiz, { id: ID + "-c2", n: 2, total: 3, etiqueta: "Consejo 2 de 3", texto: "Micrófono permitido y Chrome", x: 96, y: 120, entrada: t3, salida: t4 - 0.4 });
          tl.fromTo("#cap13-mic", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, t3 + 0.4);
          tl.fromTo("#cap13-mic-ok", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, t3 + 1.6);
          tl.fromTo("#cap13-mas", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t3 + 2.4);
          const chrome = AP.chip(tl, raiz, { id: ID + "-chrome", tipo: "extension", texto: "Google Chrome", x: 1060, y: 476, entrada: t3 + 2.7 });
          AP.salir(tl, ["#cap13-mic", "#cap13-mas", chrome], t4 - 0.4);

          // ── f4: «Computadora, recalibrar» ──
          AP.paso(tl, raiz, { id: ID + "-c3", n: 3, total: 3, etiqueta: "Consejo 3 de 3", texto: "¿Cursor torcido? Recalibra", x: 96, y: 120, entrada: t4, salida: t5 - 0.4 });
          const voz = AP.comandoVoz(tl, raiz, { id: ID + "-voz", texto: "Computadora, recalibrar", x: 96, y: 440, entrada: t4 + 0.9, duracion: 1.6, salida: t5 - 0.4 });
          tl.fromTo("#cap13-diana", { opacity: 0, scale: 0.8, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: "power3.out" }, t4 + 1.0);
          tl.fromTo("#cap13-diana-progreso", { attr: { "stroke-dashoffset": 942.48 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.4, ease: "power1.inOut" }, t4 + 2.3);
          tl.fromTo("#cap13-diana-centro", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.5, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, t4 + 3.7);
          AP.salir(tl, "#cap13-diana", t5 - 0.4);

          // ── f5: resumen de 4 ideas + mascotas que se despiden ──
          const durF5 = fin(5, t5 + 5.5) - t5;
          [1, 2, 3, 4].forEach((n, i) => {
            const tt = t5 + 0.2 + i * Math.min(1.0, (durF5 - 1) / 4);
            tl.fromTo("#cap13-idea-" + n, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, tt);
            tl.fromTo("#cap13-idea-" + n + " .cap13-idea-icono", { scale: 0.5 }, { scale: 1, duration: 0.6, ease: "back.out(2)" }, tt + 0.1);
          });
          tl.to("#cap13-ideas", { opacity: 0, y: -30, duration: 0.45, ease: "power2.in" }, t6 - 0.5);

          const tM = t5 + 3.6;
          const mascotas = [
            { nombre: "cuchu", x: 310 },
            { nombre: "yati", x: 829 },
            { nombre: "tinku", x: 1348 },
          ];
          mascotas.forEach((m, i) => {
            const desde = tM + i * 0.25;
            AP.mascota(tl, raiz, {
              id: ID + "-" + m.nombre,
              nombre: m.nombre,
              x: m.x,
              y: 524,
              alto: 306,
              entrada: desde,
              animaciones: [
                { anim: "happy", desde: 0, hasta: desde + 0.9 },
                { anim: "wave", desde: desde + 0.9, hasta: D },
              ],
            });
          });

          // ── f6: logo + adaptape.cc ──
          tl.fromTo("#cap13-logo", { opacity: 0, scale: 0.6, rotation: -10 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.7)" }, t6);
          tl.fromTo("#cap13-url", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, t6 + 0.3);
          tl.fromTo("#cap13-adios", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, fin(6, t6 + 3.9) - 1.3);

          // Última escena: fundido final (el telón, por encima de todo).
          raiz.appendChild(document.getElementById("cap13-telon"));
          tl.fromTo("#cap13-telon", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.in" }, D - 0.75);

          window.__timelines[ID] = tl;
        })();
      </script>
