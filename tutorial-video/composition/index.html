    <script>
      (function () {
        const T = window.TIEMPOS;
        const caps = T.capitulos;
        const FUNDIDO = T.fundido; // s de solape entre capítulos (lo escribe generar.mjs)
        const tl = gsap.timeline({ paused: true });

        // Transición suave entre capítulos: el entrante aparece sobre el saliente
        // (que sigue visible FUNDIDO s más; ver generar.mjs). Sin salidas propias.
        caps.forEach((c, i) => {
          if (i === 0) return;
          tl.fromTo(
            "#el-" + c.id,
            { opacity: 0, scale: 1.015 },
            { opacity: 1, scale: 1, duration: FUNDIDO, ease: "sine.inOut" },
            c.inicio
          );
        });

        window.__timelines["main"] = tl;
      })();
