      <div data-hf-id="hf-m394" id="ap-subs" class="ap-subs" data-layout-allow-caption-zone data-layout-allow-overlap>
        <div data-hf-id="hf-6ujz" id="sub-cap00-f1" class="ap-sub clip" data-start="0.6" data-duration="1.671" data-track-index="1"><span data-hf-id="hf-bbbq">¡Hola! Qué bueno tenerte aquí.</span></div>
        <div data-hf-id="hf-owc2" id="sub-cap00-f2" class="ap-sub clip" data-start="2.636" data-duration="3.715" data-track-index="1"><span data-hf-id="hf-ketk">Imagina usar tu computadora sin tocar el ratón ni el teclado.</span></div>
        <div data-hf-id="hf-53u1" id="sub-cap00-f3" class="ap-sub clip" data-start="6.88" data-duration="2.586" data-track-index="1"><span data-hf-id="hf-hjru">Solo con tu voz, tu cabeza o tus manos.</span></div>
        <div data-hf-id="hf-a836" id="sub-cap00-f4" class="ap-sub clip" data-start="9.996" data-duration="4.077" data-track-index="1"><span data-hf-id="hf-658o">Eso es AdaptaPE. Y en este video te enseño a usarlo, paso a paso.</span></div>
        <div data-hf-id="hf-tll9" id="sub-cap01-f1" class="ap-sub clip" data-start="15.573" data-duration="3.994" data-track-index="1"><span data-hf-id="hf-thmn">AdaptaPE es una ayuda de accesibilidad gratuita, hecha en Perú.</span></div>
        <div data-hf-id="hf-u7jf" id="sub-cap01-f2-1" class="ap-sub clip" data-start="20.149" data-duration="3.282" data-track-index="1"><span data-hf-id="hf-tyvy">Está pensada para personas con poca movilidad en las manos,</span></div>
        <div data-hf-id="hf-danu" id="sub-cap01-f2-2" class="ap-sub clip" data-start="23.431" data-duration="2.596" data-track-index="1"><span data-hf-id="hf-vl7s">con baja visión o daltonismo, y sus familias.</span></div>
        <div data-hf-id="hf-zqta" id="sub-cap01-f3-1" class="ap-sub clip" data-start="26.513" data-duration="4.804" data-track-index="1"><span data-hf-id="hf-2zj9">Hay dos versiones. Lite es la ligera: voz, filtros de color y mascota.</span></div>
        <div data-hf-id="hf-re0f" id="sub-cap01-f3-2" class="ap-sub clip" data-start="31.317" data-duration="3.388" data-track-index="1"><span data-hf-id="hf-ji6w">Ideal para computadoras sencillas o sin cámara.</span></div>
        <div data-hf-id="hf-q5su" id="sub-cap01-f4" class="ap-sub clip" data-start="35.425" data-duration="4.571" data-track-index="1"><span data-hf-id="hf-cvl9">Base lo tiene todo: además suma el cursor con cámara y la lectura en voz alta.</span></div>
        <div data-hf-id="hf-atxc" id="sub-cap01-f5-1" class="ap-sub clip" data-start="40.669" data-duration="2.59" data-track-index="1"><span data-hf-id="hf-utdy">Y puedes usarlas como extensión del navegador,</span></div>
        <div data-hf-id="hf-61m0" id="sub-cap01-f5-2" class="ap-sub clip" data-start="43.259" data-duration="2.302" data-track-index="1"><span data-hf-id="hf-5nq8">o como aplicación en Windows y en macOS.</span></div>
        <div data-hf-id="hf-mr6c" id="sub-cap02-f1-1" class="ap-sub clip" data-start="47.061" data-duration="1.902" data-track-index="1"><span data-hf-id="hf-ormw">Empecemos por la extensión.</span></div>
        <div data-hf-id="hf-dfot" id="sub-cap02-f1-2" class="ap-sub clip" data-start="48.963" data-duration="4.13" data-track-index="1"><span data-hf-id="hf-j1s6">Funciona en Google Chrome, Edge o Brave, versión 119 o más reciente.</span></div>
        <div data-hf-id="hf-atai" id="sub-cap02-f2-1" class="ap-sub clip" data-start="53.439" data-duration="2.731" data-track-index="1"><span data-hf-id="hf-s46j">Lo más fácil es entrar a la Chrome Web Store,</span></div>
        <div data-hf-id="hf-mwnw" id="sub-cap02-f2-2" class="ap-sub clip" data-start="56.17" data-duration="3.505" data-track-index="1"><span data-hf-id="hf-7opj">buscar AdaptaPE o AdaptaPE Lite, y pulsar «Añadir a Chrome».</span></div>
        <div data-hf-id="hf-erc8" id="sub-cap02-f3" class="ap-sub clip" data-start="60.073" data-duration="3.108" data-track-index="1"><span data-hf-id="hf-vlx2">Chrome te pedirá confirmar. Pulsa «Añadir extensión».</span></div>
        <div data-hf-id="hf-kk8w" id="sub-cap02-f4-1" class="ap-sub clip" data-start="63.641" data-duration="2.706" data-track-index="1"><span data-hf-id="hf-esl3">Luego, toca el ícono de la pieza de rompecabezas</span></div>
        <div data-hf-id="hf-k2cp" id="sub-cap02-f4-2" class="ap-sub clip" data-start="66.347" data-duration="3.286" data-track-index="1"><span data-hf-id="hf-zq6w">y fija AdaptaPE con el alfiler, para tenerlo siempre a mano.</span></div>
        <div data-hf-id="hf-tyjv" id="sub-cap02-f5-1" class="ap-sub clip" data-start="70.237" data-duration="3.76" data-track-index="1"><span data-hf-id="hf-5p5a">Si te pasaron la carpeta del proyecto, abre la página de extensiones,</span></div>
        <div data-hf-id="hf-xzhq" id="sub-cap02-f5-2" class="ap-sub clip" data-start="73.997" data-duration="3.467" data-track-index="1"><span data-hf-id="hf-mh8w">activa el modo de desarrollador y elige «Cargar descomprimida».</span></div>
        <div data-hf-id="hf-in1b" id="sub-cap03-f1" class="ap-sub clip" data-start="78.964" data-duration="2.615" data-track-index="1"><span data-hf-id="hf-djf9">Al instalarla se abre una página de bienvenida.</span></div>
        <div data-hf-id="hf-uhqt" id="sub-cap03-f2-1" class="ap-sub clip" data-start="82.142" data-duration="1.672" data-track-index="1"><span data-hf-id="hf-td9s">Ahí verás interruptores grandes.</span></div>
        <div data-hf-id="hf-7jhl" id="sub-cap03-f2-2" class="ap-sub clip" data-start="83.814" data-duration="3.094" data-track-index="1"><span data-hf-id="hf-vwm8">En Base: control por voz, cursor con cámara y lectura en voz alta.</span></div>
        <div data-hf-id="hf-y7v4" id="sub-cap03-f2-3" class="ap-sub clip" data-start="86.908" data-duration="1.213" data-track-index="1"><span data-hf-id="hf-2g3v">En Lite, solo la voz.</span></div>
        <div data-hf-id="hf-caqv" id="sub-cap03-f3" class="ap-sub clip" data-start="88.589" data-duration="3.067" data-track-index="1"><span data-hf-id="hf-k1dd">Todo empieza apagado. Tú decides qué encender.</span></div>
        <div data-hf-id="hf-gxps" id="sub-cap03-f4-1" class="ap-sub clip" data-start="92.188" data-duration="4.444" data-track-index="1"><span data-hf-id="hf-0bu9">Al activar la voz, se abre una página para dar permiso al micrófono.</span></div>
        <div data-hf-id="hf-0wlb" id="sub-cap03-f4-2" class="ap-sub clip" data-start="96.632" data-duration="4.211" data-track-index="1"><span data-hf-id="hf-ndus">Pulsa «Permitir micrófono», y en el aviso de Chrome, «Permitir».</span></div>
        <div data-hf-id="hf-z9s5" id="sub-cap03-f5-1" class="ap-sub clip" data-start="101.514" data-duration="3.463" data-track-index="1"><span data-hf-id="hf-kl54">Con la cámara pasa lo mismo, y la imagen se procesa solo en tu equipo.</span></div>
        <div data-hf-id="hf-epvt" id="sub-cap03-f5-2" class="ap-sub clip" data-start="104.977" data-duration="1.642" data-track-index="1"><span data-hf-id="hf-cvr0">Nunca sale de tu computadora.</span></div>
        <div data-hf-id="hf-3wxr" id="sub-cap03-f6" class="ap-sub clip" data-start="107.121" data-duration="2.647" data-track-index="1"><span data-hf-id="hf-pdis">Solo lo haces una vez y sirve para todas las páginas.</span></div>
        <div data-hf-id="hf-vbps" id="sub-cap04-f1" class="ap-sub clip" data-start="111.268" data-duration="3.808" data-track-index="1"><span data-hf-id="hf-ne6i">Toca el ícono de AdaptaPE y se abre su panel. Aquí está todo.</span></div>
        <div data-hf-id="hf-lkjb" id="sub-cap04-f2-1" class="ap-sub clip" data-start="115.551" data-duration="3.928" data-track-index="1"><span data-hf-id="hf-0ahz">Arriba, la lectura en voz alta y el control por voz, con su idioma:</span></div>
        <div data-hf-id="hf-qi2e" id="sub-cap04-f2-2" class="ap-sub clip" data-start="119.479" data-duration="3.299" data-track-index="1"><span data-hf-id="hf-7gbk">español, inglés, portugués, alemán, francés o italiano.</span></div>
        <div data-hf-id="hf-xkul" id="sub-cap04-f3" class="ap-sub clip" data-start="123.485" data-duration="4.147" data-track-index="1"><span data-hf-id="hf-v9fk">Más abajo, los filtros de color, el cursor con cámara y tu mascota.</span></div>
        <div data-hf-id="hf-s15c" id="sub-cap04-f4" class="ap-sub clip" data-start="128.347" data-duration="3.795" data-track-index="1"><span data-hf-id="hf-6p2r">Los cambios se guardan solos, y se aplican al instante, sin recargar la página.</span></div>
        <div data-hf-id="hf-6xun" id="sub-cap04-f5" class="ap-sub clip" data-start="132.876" data-duration="2.835" data-track-index="1"><span data-hf-id="hf-ik4t">En Lite verás el mismo panel, pero sin cámara ni lectura.</span></div>
        <div data-hf-id="hf-ytcm" id="sub-cap05-f1" class="ap-sub clip" data-start="137.211" data-duration="4.569" data-track-index="1"><span data-hf-id="hf-o0z3">Ahora, la magia: la voz. Todo empieza con una palabra: «Computadora».</span></div>
        <div data-hf-id="hf-ghpm" id="sub-cap05-f2" class="ap-sub clip" data-start="142.212" data-duration="4.71" data-track-index="1"><span data-hf-id="hf-logs">Puedes decirlo todo de corrido: «Computadora, abre YouTube».</span></div>
        <div data-hf-id="hf-mkg5" id="sub-cap05-f3-1" class="ap-sub clip" data-start="147.506" data-duration="3.321" data-track-index="1"><span data-hf-id="hf-a20h">O en dos pasos: di «Computadora», espera el pitido,</span></div>
        <div data-hf-id="hf-5f7g" id="sub-cap05-f3-2" class="ap-sub clip" data-start="150.827" data-duration="2.759" data-track-index="1"><span data-hf-id="hf-j1gt">y tienes ocho segundos para dar tu orden.</span></div>
        <div data-hf-id="hf-dkdo" id="sub-cap05-f4-1" class="ap-sub clip" data-start="154.242" data-duration="3.717" data-track-index="1"><span data-hf-id="hf-35jx">Abajo a la izquierda verás un aviso. En rojo, está escuchando.</span></div>
        <div data-hf-id="hf-tih4" id="sub-cap05-f4-2" class="ap-sub clip" data-start="157.959" data-duration="1.752" data-track-index="1"><span data-hf-id="hf-r6l1">En azul, espera tu orden.</span></div>
        <div data-hf-id="hf-mahi" id="sub-cap05-f5-1" class="ap-sub clip" data-start="160.476" data-duration="1.642" data-track-index="1"><span data-hf-id="hf-xe9p">Y habla con naturalidad.</span></div>
        <div data-hf-id="hf-omk6" id="sub-cap05-f5-2" class="ap-sub clip" data-start="162.118" data-duration="3.488" data-track-index="1"><span data-hf-id="hf-pokj">«Computadora, por favor, ábreme Wikipedia» también funciona.</span></div>
        <div data-hf-id="hf-8u7c" id="sub-cap05-f6" class="ap-sub clip" data-start="166.25" data-duration="3.463" data-track-index="1"><span data-hf-id="hf-itba">Si no sabes qué decir, solo pregunta: «Computadora, ayuda».</span></div>
        <div data-hf-id="hf-hf2p" id="sub-cap06-f1" class="ap-sub clip" data-start="171.213" data-duration="4.484" data-track-index="1"><span data-hf-id="hf-0rr1">Veamos más órdenes útiles. Para buscar: «busca recetas en YouTube».</span></div>
        <div data-hf-id="hf-sddq" id="sub-cap06-f2" class="ap-sub clip" data-start="176.34" data-duration="4.138" data-track-index="1"><span data-hf-id="hf-ktwr">Para moverte por la página: «baja», «sube un poco» o «ve al final».</span></div>
        <div data-hf-id="hf-uz6o" id="sub-cap06-f3" class="ap-sub clip" data-start="181.26" data-duration="4.86" data-track-index="1"><span data-hf-id="hf-lt58">Para las pestañas: «nueva pestaña», «siguiente pestaña» o «cierra esta pestaña».</span></div>
        <div data-hf-id="hf-5oh6" id="sub-cap06-f4-1" class="ap-sub clip" data-start="186.738" data-duration="4.594" data-track-index="1"><span data-hf-id="hf-xoa1">Para elegir algo de la pantalla, di «selecciona Contacto». Se marca en amarillo.</span></div>
        <div data-hf-id="hf-lj5i" id="sub-cap06-f4-2" class="ap-sub clip" data-start="191.332" data-duration="1.514" data-track-index="1"><span data-hf-id="hf-gln7">Luego di «dale clic».</span></div>
        <div data-hf-id="hf-rsak" id="sub-cap06-f5-1" class="ap-sub clip" data-start="193.574" data-duration="3.763" data-track-index="1"><span data-hf-id="hf-6g5g">Para escribir: «enfoca correo» y luego «escribe hola, cómo estás».</span></div>
        <div data-hf-id="hf-iuft" id="sub-cap06-f5-2" class="ap-sub clip" data-start="197.337" data-duration="3.102" data-track-index="1"><span data-hf-id="hf-s4vx">Por tu seguridad, no escribe en campos de contraseña.</span></div>
        <div data-hf-id="hf-zrtj" id="sub-cap06-f6" class="ap-sub clip" data-start="201.089" data-duration="4.961" data-track-index="1"><span data-hf-id="hf-2sgz">Y también: «aumenta zoom», «pantalla completa» o «silencio» para callar la lectura.</span></div>
        <div data-hf-id="hf-xy1q" id="sub-cap07-f1" class="ap-sub clip" data-start="207.55" data-duration="3.496" data-track-index="1"><span data-hf-id="hf-od77">Ahora, el cursor con cámara. Esto es solo de la versión Base.</span></div>
        <div data-hf-id="hf-4l1k" id="sub-cap07-f2-1" class="ap-sub clip" data-start="211.452" data-duration="4.896" data-track-index="1"><span data-hf-id="hf-c1ys">Enciende «Cursor con cámara» en el panel y elige qué usarás para moverlo.</span></div>
        <div data-hf-id="hf-8rji" id="sub-cap07-f2-2" class="ap-sub clip" data-start="216.348" data-duration="1.39" data-track-index="1"><span data-hf-id="hf-vh6b">Hay tres modos.</span></div>
        <div data-hf-id="hf-q2wv" id="sub-cap07-f3-1" class="ap-sub clip" data-start="218.373" data-duration="3.692" data-track-index="1"><span data-hf-id="hf-i44c">Cabeza y torso: siéntate cómodo y quédate quieto un segundo.</span></div>
        <div data-hf-id="hf-kwz0" id="sub-cap07-f3-2" class="ap-sub clip" data-start="222.065" data-duration="1.954" data-track-index="1"><span data-hf-id="hf-777v">AdaptaPE aprende tu postura.</span></div>
        <div data-hf-id="hf-ii07" id="sub-cap07-f4-1" class="ap-sub clip" data-start="224.822" data-duration="3.512" data-track-index="1"><span data-hf-id="hf-reso">Luego, inclina un poco la cabeza y el cursor se mueve.</span></div>
        <div data-hf-id="hf-e13b" id="sub-cap07-f4-2" class="ap-sub clip" data-start="228.334" data-duration="2.152" data-track-index="1"><span data-hf-id="hf-tx1t">Vuelve al centro y se detiene.</span></div>
        <div data-hf-id="hf-kptg" id="sub-cap07-f5-1" class="ap-sub clip" data-start="231.146" data-duration="4.222" data-track-index="1"><span data-hf-id="hf-2i7a">Brazos, manos o puños: funciona como un joystick invisible.</span></div>
        <div data-hf-id="hf-35wz" id="sub-cap07-f5-2" class="ap-sub clip" data-start="235.368" data-duration="3.78" data-track-index="1"><span data-hf-id="hf-6qzb">Mueve la mano un poco, sostenla, y el cursor avanza.</span></div>
        <div data-hf-id="hf-fxro" id="sub-cap07-f6-1" class="ap-sub clip" data-start="240.092" data-duration="3.444" data-track-index="1"><span data-hf-id="hf-bkvv">Muñón o mano parcial: sigue una zona con textura,</span></div>
        <div data-hf-id="hf-hxks" id="sub-cap07-f6-2" class="ap-sub clip" data-start="243.536" data-duration="2.598" data-track-index="1"><span data-hf-id="hf-bca2">como la piel, una venda o la manga.</span></div>
        <div data-hf-id="hf-42g5" id="sub-cap07-f6-3" class="ap-sub clip" data-start="246.133" data-duration="1.571" data-track-index="1"><span data-hf-id="hf-m79n">No necesita dedos.</span></div>
        <div data-hf-id="hf-3ys5" id="sub-cap07-f7-1" class="ap-sub clip" data-start="248.536" data-duration="2.035" data-track-index="1"><span data-hf-id="hf-e8o5">Consejo: busca buena luz de frente,</span></div>
        <div data-hf-id="hf-hh2n" id="sub-cap07-f7-2" class="ap-sub clip" data-start="250.571" data-duration="2.698" data-track-index="1"><span data-hf-id="hf-jxuk">y evita tener una ventana brillante detrás de ti.</span></div>
        <div data-hf-id="hf-oa5j" id="sub-cap08-f1-1" class="ap-sub clip" data-start="254.769" data-duration="1.089" data-track-index="1"><span data-hf-id="hf-mwaa">¿Y el clic?</span></div>
        <div data-hf-id="hf-lg9w" id="sub-cap08-f1-2" class="ap-sub clip" data-start="255.858" data-duration="4.873" data-track-index="1"><span data-hf-id="hf-rs4d">La forma más simple: deja el cursor quieto sobre un botón durante un segundo.</span></div>
        <div data-hf-id="hf-ikg9" id="sub-cap08-f1-3" class="ap-sub clip" data-start="260.731" data-duration="2.408" data-track-index="1"><span data-hf-id="hf-e7n4">Un anillo se llena, y listo, clic.</span></div>
        <div data-hf-id="hf-z7fi" id="sub-cap08-f2-1" class="ap-sub clip" data-start="264.082" data-duration="4.007" data-track-index="1"><span data-hf-id="hf-mxns">Con la mano: junta el pulgar y el índice, como una pinza, y suelta.</span></div>
        <div data-hf-id="hf-thvz" id="sub-cap08-f2-2" class="ap-sub clip" data-start="268.089" data-duration="3.098" data-track-index="1"><span data-hf-id="hf-1nap">Si mantienes la pinza un momento, es clic derecho.</span></div>
        <div data-hf-id="hf-m1at" id="sub-cap08-f3-1" class="ap-sub clip" data-start="272.078" data-duration="2.845" data-track-index="1"><span data-hf-id="hf-e1mq">Con la cabeza: abre la boca y ciérrala. Al cerrar, hace clic.</span></div>
        <div data-hf-id="hf-5v32" id="sub-cap08-f3-2" class="ap-sub clip" data-start="274.923" data-duration="1.278" data-track-index="1"><span data-hf-id="hf-kft9">Si bostezas, no cuenta.</span></div>
        <div data-hf-id="hf-zdfq" id="sub-cap08-f4" class="ap-sub clip" data-start="276.936" data-duration="5.751" data-track-index="1"><span data-hf-id="hf-purf">También puedes cerrar el puño para dejar quieto el cursor y hacer clic al segundo.</span></div>
        <div data-hf-id="hf-us9a" id="sub-cap08-f5" class="ap-sub clip" data-start="283.584" data-duration="3.56" data-track-index="1"><span data-hf-id="hf-3xyc">Y siempre puedes decir: «Computadora, clic», o «clic derecho».</span></div>
        <div data-hf-id="hf-xbi4" id="sub-cap09-f1-1" class="ap-sub clip" data-start="288.644" data-duration="3.017" data-track-index="1"><span data-hf-id="hf-qd34">La lectura en voz alta, en Base, lee lo que señalas.</span></div>
        <div data-hf-id="hf-6xpu" id="sub-cap09-f1-2" class="ap-sub clip" data-start="291.661" data-duration="3.57" data-track-index="1"><span data-hf-id="hf-n0aw">Pasa el cursor sobre un texto o botón y escucharás lo que dice.</span></div>
        <div data-hf-id="hf-46w3" id="sub-cap09-f1-3" class="ap-sub clip" data-start="295.231" data-duration="2.514" data-track-index="1"><span data-hf-id="hf-eap9">Para callarla, di «Computadora, silencio».</span></div>
        <div data-hf-id="hf-smxu" id="sub-cap09-f2-1" class="ap-sub clip" data-start="298.441" data-duration="2.109" data-track-index="1"><span data-hf-id="hf-fvv2">Los filtros de color ayudan a las personas</span></div>
        <div data-hf-id="hf-td8g" id="sub-cap09-f2-2" class="ap-sub clip" data-start="300.55" data-duration="2.277" data-track-index="1"><span data-hf-id="hf-aut6">con daltonismo a distinguir mejor los colores.</span></div>
        <div data-hf-id="hf-8qo8" id="sub-cap09-f2-3" class="ap-sub clip" data-start="302.827" data-duration="1.771" data-track-index="1"><span data-hf-id="hf-anmy">Hay siete, y están en Base y Lite.</span></div>
        <div data-hf-id="hf-ripg" id="sub-cap09-f3-1" class="ap-sub clip" data-start="305.184" data-duration="2.64" data-track-index="1"><span data-hf-id="hf-mkt9">Elige uno en el panel y la página cambia al instante.</span></div>
        <div data-hf-id="hf-vsd8" id="sub-cap09-f3-2" class="ap-sub clip" data-start="307.824" data-duration="2.554" data-track-index="1"><span data-hf-id="hf-ninl">Para volver a la normalidad, pulsa «Quitar filtro».</span></div>
        <div data-hf-id="hf-8wpq" id="sub-cap10-f1-1" class="ap-sub clip" data-start="311.878" data-duration="1.806" data-track-index="1"><span data-hf-id="hf-qejs">¿Quieres compañía?</span></div>
        <div data-hf-id="hf-37mc" id="sub-cap10-f1-2" class="ap-sub clip" data-start="313.684" data-duration="6.322" data-track-index="1"><span data-hf-id="hf-rzo6">Elige una mascota: Tinku, el gallito de las rocas; Cuchu, el cuy; o Yati, la llama.</span></div>
        <div data-hf-id="hf-73m8" id="sub-cap10-f2-1" class="ap-sub clip" data-start="320.819" data-duration="1.882" data-track-index="1"><span data-hf-id="hf-wfmp">Te mira, reacciona cuando hablas,</span></div>
        <div data-hf-id="hf-ft9h" id="sub-cap10-f2-2" class="ap-sub clip" data-start="322.701" data-duration="2.801" data-track-index="1"><span data-hf-id="hf-6htb">y puedes decirle «saluda mascota» o «duerme mascota».</span></div>
        <div data-hf-id="hf-ihox" id="sub-cap10-f3-1" class="ap-sub clip" data-start="325.841" data-duration="3.738" data-track-index="1"><span data-hf-id="hf-1a61">Además, AdaptaPE cambia tu página de Nueva pestaña,</span></div>
        <div data-hf-id="hf-nib2" id="sub-cap10-f3-2" class="ap-sub clip" data-start="329.579" data-duration="3.675" data-track-index="1"><span data-hf-id="hf-tjuf">para que la voz y el cursor también funcionen ahí.</span></div>
        <div data-hf-id="hf-5qxu" id="sub-cap10-f4-1" class="ap-sub clip" data-start="333.819" data-duration="2.351" data-track-index="1"><span data-hf-id="hf-5qms">Puedes buscar, ver tus sitios favoritos</span></div>
        <div data-hf-id="hf-xto5" id="sub-cap10-f4-2" class="ap-sub clip" data-start="336.17" data-duration="3.852" data-track-index="1"><span data-hf-id="hf-9jja">y personalizarla con temas de colores, incluso uno de alto contraste.</span></div>
        <div data-hf-id="hf-obfw" id="sub-cap11-f1-1" class="ap-sub clip" data-start="341.522" data-duration="3.11" data-track-index="1"><span data-hf-id="hf-gpmh">¿Quieres controlar toda tu computadora, no solo el navegador?</span></div>
        <div data-hf-id="hf-194t" id="sub-cap11-f1-2" class="ap-sub clip" data-start="344.632" data-duration="1.487" data-track-index="1"><span data-hf-id="hf-tnre">Usa la app de escritorio.</span></div>
        <div data-hf-id="hf-718x" id="sub-cap11-f2-1" class="ap-sub clip" data-start="346.325" data-duration="3.268" data-track-index="1"><span data-hf-id="hf-qvsn">En Windows 10 u 11, descarga el instalador de Base</span></div>
        <div data-hf-id="hf-gp57" id="sub-cap11-f2-2" class="ap-sub clip" data-start="349.593" data-duration="2.536" data-track-index="1"><span data-hf-id="hf-1ass">o de Lite desde adaptape.cc y ábrelo.</span></div>
        <div data-hf-id="hf-j0wr" id="sub-cap11-f3-1" class="ap-sub clip" data-start="352.326" data-duration="3.537" data-track-index="1"><span data-hf-id="hf-nefr">Si aparece «Windows protegió su PC» y confías en el archivo,</span></div>
        <div data-hf-id="hf-mu7n" id="sub-cap11-f3-2" class="ap-sub clip" data-start="355.863" data-duration="3.173" data-track-index="1"><span data-hf-id="hf-no24">pulsa «Más información» y «Ejecutar de todas formas».</span></div>
        <div data-hf-id="hf-zg0c" id="sub-cap11-f4" class="ap-sub clip" data-start="359.502" data-duration="4.883" data-track-index="1"><span data-hf-id="hf-3pp8">Sigue los pasos, elige si quieres accesos directos, y al final, «Abrir Adapta PE».</span></div>
        <div data-hf-id="hf-0ql5" id="sub-cap11-f5-1" class="ap-sub clip" data-start="364.919" data-duration="3.983" data-track-index="1"><span data-hf-id="hf-ldv3">La app vive junto al reloj, en la bandeja, y tiene un panel flotante.</span></div>
        <div data-hf-id="hf-y43g" id="sub-cap11-f5-2" class="ap-sub clip" data-start="368.902" data-duration="3.879" data-track-index="1"><span data-hf-id="hf-6ns0">Enciende «Activar voz» y prueba: «Computadora, abre Bloc de notas».</span></div>
        <div data-hf-id="hf-f6hn" id="sub-cap11-f6-1" class="ap-sub clip" data-start="373.403" data-duration="3.649" data-track-index="1"><span data-hf-id="hf-sqi1">En Base, también activas el cursor con cámara y el clic por permanencia.</span></div>
        <div data-hf-id="hf-sc7r" id="sub-cap11-f6-2" class="ap-sub clip" data-start="377.052" data-duration="2.692" data-track-index="1"><span data-hf-id="hf-81v2">Lite se queda con la voz, los filtros y la mascota.</span></div>
        <div data-hf-id="hf-rgwh" id="sub-cap11-f7" class="ap-sub clip" data-start="380.289" data-duration="4.375" data-track-index="1"><span data-hf-id="hf-j330">Para parar todo, usa «Detener todo», o el atajo Ctrl+Shift+S.</span></div>
        <div data-hf-id="hf-xc2v" id="sub-cap12-f1-1" class="ap-sub clip" data-start="386.164" data-duration="2.879" data-track-index="1"><span data-hf-id="hf-vi0j">En Mac, necesitas macOS Sonoma o más reciente.</span></div>
        <div data-hf-id="hf-is78" id="sub-cap12-f1-2" class="ap-sub clip" data-start="389.044" data-duration="2.88" data-track-index="1"><span data-hf-id="hf-0t56">Funciona en Mac con Intel y con Apple Silicon.</span></div>
        <div data-hf-id="hf-t2u8" id="sub-cap12-f2" class="ap-sub clip" data-start="392.926" data-duration="4.102" data-track-index="1"><span data-hf-id="hf-0ydq">Abre el archivo DMG y arrastra AdaptaPE a la carpeta Aplicaciones.</span></div>
        <div data-hf-id="hf-hnkw" id="sub-cap12-f3-1" class="ap-sub clip" data-start="397.955" data-duration="3.604" data-track-index="1"><span data-hf-id="hf-qlkq">Si macOS la bloquea la primera vez, ve a Ajustes del Sistema,</span></div>
        <div data-hf-id="hf-60ly" id="sub-cap12-f3-2" class="ap-sub clip" data-start="401.559" data-duration="3.29" data-track-index="1"><span data-hf-id="hf-v1hh">Privacidad y seguridad, y pulsa «Abrir de todos modos».</span></div>
        <div data-hf-id="hf-co8u" id="sub-cap12-f4-1" class="ap-sub clip" data-start="405.51" data-duration="3.914" data-track-index="1"><span data-hf-id="hf-rhwf">Luego da los permisos: micrófono y reconocimiento de voz para hablar,</span></div>
        <div data-hf-id="hf-x5be" id="sub-cap12-f4-2" class="ap-sub clip" data-start="409.424" data-duration="3.254" data-track-index="1"><span data-hf-id="hf-dstu">y Accesibilidad para que pueda pulsar y escribir por ti.</span></div>
        <div data-hf-id="hf-se95" id="sub-cap12-f5-1" class="ap-sub clip" data-start="413.815" data-duration="3.313" data-track-index="1"><span data-hf-id="hf-obca">Para los filtros de color, también te pedirá Grabación de pantalla.</span></div>
        <div data-hf-id="hf-n0g3" id="sub-cap12-f5-2" class="ap-sub clip" data-start="417.128" data-duration="1.281" data-track-index="1"><span data-hf-id="hf-bu3o">Y en Base, la cámara.</span></div>
        <div data-hf-id="hf-2q3r" id="sub-cap12-f6-1" class="ap-sub clip" data-start="419.768" data-duration="2.79" data-track-index="1"><span data-hf-id="hf-7kvo">AdaptaPE aparece en la barra de menú, arriba.</span></div>
        <div data-hf-id="hf-0lvg" id="sub-cap12-f6-2" class="ap-sub clip" data-start="422.558" data-duration="3" data-track-index="1"><span data-hf-id="hf-upzz">Enciende la voz y di: «Computadora, abre Safari».</span></div>
        <div data-hf-id="hf-jsxf" id="sub-cap12-f7" class="ap-sub clip" data-start="426.504" data-duration="2.467" data-track-index="1"><span data-hf-id="hf-n43n">Por ahora, las apps de escritorio entienden órdenes en español.</span></div>
        <div data-hf-id="hf-fsza" id="sub-cap13-f1" class="ap-sub clip" data-start="430.471" data-duration="2.41" data-track-index="1"><span data-hf-id="hf-uk14">Antes de irte, unos consejos rápidos.</span></div>
        <div data-hf-id="hf-gy9d" id="sub-cap13-f2" class="ap-sub clip" data-start="433.087" data-duration="3.916" data-track-index="1"><span data-hf-id="hf-2k7p">Si tienes Base y Lite a la vez, enciende la voz solo en una.</span></div>
        <div data-hf-id="hf-dr49" id="sub-cap13-f3" class="ap-sub clip" data-start="437.602" data-duration="3.615" data-track-index="1"><span data-hf-id="hf-5di3">Si no te escucha, revisa el permiso del micrófono y usa Google Chrome.</span></div>
        <div data-hf-id="hf-g1hd" id="sub-cap13-f4" class="ap-sub clip" data-start="441.865" data-duration="3.465" data-track-index="1"><span data-hf-id="hf-etr1">Si el cursor se va de lado, di «Computadora, recalibrar».</span></div>
        <div data-hf-id="hf-jyqr" id="sub-cap13-f5" class="ap-sub clip" data-start="446.062" data-duration="5.312" data-track-index="1"><span data-hf-id="hf-zv12">Eso es todo. Ahora te toca a ti. Di «Computadora», y empieza a navegar a tu manera.</span></div>
        <div data-hf-id="hf-5xvm" id="sub-cap13-f6" class="ap-sub clip" data-start="451.686" data-duration="3.882" data-track-index="1"><span data-hf-id="hf-jems">Encuentra AdaptaPE en adaptape.cc. ¡Hasta pronto!</span></div>
      </div>
