<!doctype html><html lang="es"><meta charset="utf-8"><title>Tienda de prueba Adapta PE</title><body>
<form><input id="buscador" name="q" type="search"><button type="submit">Buscar</button></form>
<article aria-label="Zapatos azules"><h2>Zapatos azules</h2><button id="producto">Ver producto</button></article>
<button id="otro">Otro control</button>
<script>
window.clicsProducto=0;window.clicsOtro=0;
document.getElementById('producto').onclick=()=>window.clicsProducto++;
document.getElementById('otro').onclick=()=>window.clicsOtro++;
document.querySelector('form').onsubmit=evento=>evento.preventDefault();
</script></body></html>
